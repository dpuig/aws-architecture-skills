name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately. Both `terraform show -json` output shape and Rego
      # syntax are version-sensitive, and the ZD policies depend on plan-JSON
      # structure (after_unknown). An unpinned toolchain turns a green suite
      # into a coincidence.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install conftest
        run: |
          CONFTEST_VERSION=0.56.0
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin conftest
          conftest --version

      - name: Preflight
        run: bash plugins/aws-architecture/scripts/preflight.sh

      - name: Validate Terraform modules
        run: |
          for m in plugins/aws-architecture/skills/*/assets/terraform/modules/*/*/; do
            echo "── $m"
            terraform -chdir="$m" init -backend=false -input=false >/dev/null
            terraform -chdir="$m" validate
          done

      - name: Terraform fmt
        run: terraform fmt -check -recursive plugins/aws-architecture/skills

      - name: Policies compile
        run: |
          for p in plugins/aws-architecture/skills/*/policies/opa; do
            [ -d "$p" ] || continue
            conftest verify --policy "$p"
          done

      - name: Test suites
        run: |
          fail=0
          for s in plugins/aws-architecture/skills/*/tests/run.sh; do
            echo "═══ $s"
            bash "$s" || fail=1
          done
          exit $fail

      - name: Retrieval smoke test
        run: |
          KB=$(mktemp -d)/curated
          mkdir -p "$KB/net"
          printf -- '---\ntitle: T\ndomain: network\nlast_reviewed: 2026-01-01\n---\nControl ZT-NET-014 denies 0.0.0.0/0 ingress.\n' > "$KB/net/t.md"
          S=plugins/aws-architecture/skills/aws-solution-architect/scripts/kb_search.py
          KB_ROOT="$KB" python3 "$S" --build-index
          # Exact-token preservation is the property that justifies BM25 here.
          KB_ROOT="$KB" python3 "$S" "ZT-NET-014" | grep -q 'kb://net/t.md'
          KB_ROOT="$KB" python3 "$S" "0.0.0.0/0"  | grep -q 'kb://net/t.md'
          # No corpus must exit 2, so the skill marks claims UNGROUNDED rather
          # than answering from model recall.
          KB_ROOT=/nonexistent python3 "$S" --status; test $? -eq 2

      - name: Catalog version is single-sourced
        run: |
          test -f CATALOG_VERSION
          if grep -rn 'Catalog version 0\.\|Version 0\.1 —' plugins/ ; then
            echo "::error::catalog version is restated outside CATALOG_VERSION"
            exit 1
          fi
