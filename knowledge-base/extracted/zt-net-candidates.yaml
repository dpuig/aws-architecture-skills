# BLOCKER — read before extending to further domains
# ---------------------------------------------------------------------------
blocker:
  issue: "No curated knowledge base exists in this repository."
  detail: >
    The plan's premise is output "grounded in your curated knowledge base
    rather than model recall", and the schema's `kb_source` field points at a
    `kb://` namespace holding your house position. That corpus is not present
    here. Every record in this file therefore derives entirely from public AWS
    documentation.
  consequence: >
    A catalog built only from public sources encodes generic best practice. The
    plan's Phase 4 warns that a small delta against a no-skill baseline is
    almost always this exact problem — and at 0/15 kb_source coverage, that
    delta would be small by construction, because a capable model can already
    recall the SEC05 best practices these records restate.
  resolution_required: >
    Point Phase 1 at the actual curated KB before extracting further domains.
    If no such corpus exists yet in written form, that is the real Phase 1
    input and it needs to be produced first — extraction cannot distill what
    was never written down.
